<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#800000" />
    <title>Dhruv Bhat</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html {
        background: #800000;
      }

      body {
        margin: 0;
        color: #d4af37;
        background: #800000;
        font-family: Arial, sans-serif;
      }

      main {
        display: grid;
        min-height: 100vh;
        min-height: 100svh;
        padding: 2rem 1rem;
        place-items: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 10vw, 9rem);
        font-weight: 700;
        line-height: 1.1;
        letter-spacing: -0.055em;
        text-align: center;
        text-wrap: balance;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Dhruv Bhat</h1>
    </main>
  </body>
</html>
