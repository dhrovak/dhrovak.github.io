<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3d080e" />
    <title>Dhruv Bhat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Arimo:wght@700&amp;display=swap"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      html {
        --title-enter-duration: 1.2s;
        --title-enter-delay: 0.12s;
        --arrow-enter-delay: calc(var(--title-enter-delay) + var(--title-enter-duration));
        --arrow-enter-duration: 0.4s;
        background: #3d080e;
      }

      body {
        margin: 0;
        color: #C79C5A;
        background: #3d080e;
        font-family: "Arimo", Arial, sans-serif;
      }

      main {
        display: grid;
        min-height: 100vh;
        min-height: 100svh;
        padding: 2rem 1rem;
        place-items: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 10vw, 9rem);
        font-weight: 700;
        line-height: 1.1;
        letter-spacing: -0.055em;
        text-align: center;
        text-wrap: balance;
        animation: title-enter var(--title-enter-duration) cubic-bezier(0.22, 1, 0.36, 1) var(--title-enter-delay) both;
      }

      .scroll-cue {
        position: fixed;
        right: clamp(1rem, 3vw, 2.5rem);
        bottom: clamp(1rem, 3vw, 2.5rem);
        display: grid;
        width: 44px;
        height: 44px;
        place-items: center;
        color: inherit;
        pointer-events: none;
        animation: arrow-enter var(--arrow-enter-duration) ease-out var(--arrow-enter-delay) both;
      }

      .scroll-cue svg {
        animation: arrow-cue 1s ease-in-out calc(var(--arrow-enter-delay) + var(--arrow-enter-duration)) infinite;
      }

        @keyframes title-enter {
        from {
          opacity: 0;
          filter: blur(14px);
          transform: scale(0.8);
        }

        to {
          opacity: 1;
          filter: blur(0);
          transform: scale(1);
        }
      }

      @keyframes arrow-enter {
        from {
          opacity: 0;
          visibility: hidden;
        }

        to {
          opacity: 1;
          visibility: visible;
        }
      }

      @keyframes arrow-cue {
        0%,
        100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-4px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        h1,
        .scroll-cue,
        .scroll-cue svg {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main id="top">
      <h1>Dhruv Bhat</h1>
    </main>
    <div class="scroll-cue" aria-hidden="true">
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <path d="m6 15 6-6 6 6" />
      </svg>
    </div>
  </body>
</html>
